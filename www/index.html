<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>

<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Cube Factory</title>
<style>
  html, body { margin: 0; height: 100%; background: #1b1f2a; overflow: hidden; font-family: sans-serif; color: #fff; }
  #hud { position: fixed; top: 0; left: 0; right: 0; padding: 14px; text-align: center; font-size: 18px; z-index: 2; }

             padding: 14px 22px; font-size: 18px; border: 0; border-radius: 12px; background: #4caf50; color: #fff; }
  #upgrade:disabled { background: #555; }
</style>
</head>
<body>
  <div id="hud">💰 <span id="money">0</span> | مستوى الإنتاج: <span id="lvl">1</span></div>
  <button id="upgrade"></button>

  <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
  <script src="game.js"></script>

</html>
